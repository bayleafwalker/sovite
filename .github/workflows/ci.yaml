name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock && pip install --no-deps --no-build-isolation -e .
      - run: python -m pytest
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v4.3.1
      - run: python scripts/validate_deployment.py
