profiles:
- id: delivery-local
  description: Provision one control plane and worker plus the six separately configured fixed-agent
    native services. This profile describes the composition; it does not deploy it.
  components:
  - control
  - worker
  - audit
  - native-plan
  - native-discover
  - native-coordinate
  - native-implement
  - native-inline-review
  - native-holistic-review
