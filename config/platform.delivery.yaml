apiVersion: sovite.platform/v1alpha1
kind: PlatformBundle
metadata:
  name: sovite-delivery-example
  display_name: Sovite delivery example
  description: Development-only C0 workflow binding example with separate answer-only native subscription
    services. Provision services and credentials separately; no source-writing executor or unattended
    scheduler is installed by this file.
mode: development
default_profile: delivery-local
restricted_class: C3
data_classes:
- id: C0
  name: Public and synthetic
  rank: 0
- id: C1
  name: Internal
  rank: 1
- id: C2
  name: Confidential
  rank: 2
- id: C3
  name: Restricted
  rank: 3
destinations:
- id: private-runtime
  kind: local
  boundary: private
  clearance: C3
  allowed_hosts:
  - 127.0.0.1
- id: private-state
  kind: local
  boundary: private
  clearance: C3
- id: private-telemetry
  kind: local
  boundary: private
  clearance: C1
- id: public-openai
  kind: cloud
  boundary: public
  clearance: C0
  allowed_hosts:
  - chatgpt.com
  - auth.openai.com
- id: public-anthropic
  kind: cloud
  boundary: public
  clearance: C0
  allowed_hosts:
  - api.anthropic.com
- id: public-go
  kind: cloud
  boundary: public
  clearance: C0
  allowed_hosts:
  - opencode.ai
- id: repository-candidates
  kind: cloud
  boundary: public
  clearance: C0
  allowed_hosts:
  - github.com
- id: vuoro-findings
  kind: cloud
  boundary: public
  clearance: C0
models:
- id: codex-account
  adapter: codex-subscription
  model: gpt-6.1-sol
  destination: public-openai
  identity_protocol: native-subscription
  max_concurrency: 1
- id: claude-account
  adapter: claude-subscription
  model: claude-sonnet-5
  destination: public-anthropic
  identity_protocol: native-subscription
  max_concurrency: 1
- id: go-flash
  adapter: opencode-go
  model: deepseek-v4.1-flash
  endpoint: https://opencode.ai/inference/go/openai/v1
  api_key_env: SOVITE_OPENCODE_GO_KEY
  destination: public-go
  identity_protocol: provider-service
  wire_api: chat
  max_concurrency: 1
harnesses:
- id: native-plan
  kind: agent-http
  endpoint: http://127.0.0.1:8091/run
  cancel_endpoint: http://127.0.0.1:8091/cancel
  api_key_env: SOVITE_PLAN_HARNESS_TOKEN
  idempotent: true
  capabilities:
  - native-claude
  authentication:
    mode: subscription
    credential_env: SOVITE_CLAUDE_OAUTH_TOKEN
- id: native-discover
  kind: agent-http
  endpoint: http://127.0.0.1:8092/run
  cancel_endpoint: http://127.0.0.1:8092/cancel
  api_key_env: SOVITE_DISCOVER_HARNESS_TOKEN
  idempotent: true
  capabilities:
  - native-opencode
- id: native-coordinate
  kind: agent-http
  endpoint: http://127.0.0.1:8093/run
  cancel_endpoint: http://127.0.0.1:8093/cancel
  api_key_env: SOVITE_COORDINATE_HARNESS_TOKEN
  idempotent: true
  capabilities:
  - native-claude
  authentication:
    mode: subscription
    credential_env: SOVITE_CLAUDE_OAUTH_TOKEN
- id: native-implement
  kind: agent-http
  endpoint: http://127.0.0.1:8094/run
  cancel_endpoint: http://127.0.0.1:8094/cancel
  api_key_env: SOVITE_IMPLEMENT_HARNESS_TOKEN
  idempotent: true
  capabilities:
  - native-codex
  authentication:
    mode: subscription
    credential_file_env: SOVITE_CODEX_AUTH_FILE
- id: native-inline-review
  kind: agent-http
  endpoint: http://127.0.0.1:8095/run
  cancel_endpoint: http://127.0.0.1:8095/cancel
  api_key_env: SOVITE_INLINE_REVIEW_HARNESS_TOKEN
  idempotent: true
  capabilities:
  - native-claude
  authentication:
    mode: subscription
    credential_env: SOVITE_CLAUDE_OAUTH_TOKEN
- id: native-holistic-review
  kind: agent-http
  endpoint: http://127.0.0.1:8096/run
  cancel_endpoint: http://127.0.0.1:8096/cancel
  api_key_env: SOVITE_HOLISTIC_REVIEW_HARNESS_TOKEN
  idempotent: true
  capabilities:
  - native-claude
  authentication:
    mode: subscription
    credential_env: SOVITE_CLAUDE_OAUTH_TOKEN
tools: []
agents:
- id: product-planner
  harness: native-plan
  model: claude-account
  tools: []
  instructions: Use the supplied intent, constraints and decision policy to propose an outcome and acceptance
    requirements. Request only bounded discovery needed to resolve missing inputs. Record material owner
    decisions and unresolved questions. End after a requirements-release handoff; do not continue as
    delivery orchestrator or claim owner acceptance.
- id: discovery
  harness: native-discover
  model: go-flash
  tools: []
  instructions: Investigate the assigned bounded question using the supplied permitted context. Distinguish
    evidence from hypotheses and report capability or access gaps. Return findings to the external planner.
    Do not invent retrieved sources, executed queries or approvals.
- id: orchestrator
  harness: native-coordinate
  model: claude-account
  tools: []
  instructions: Decompose the bound requirements into coherent sections with explicit dependencies.
    Propose role invocations and candidate boundaries. Pause work affected by unresolved product decisions;
    preserve unrelated eligible work. Track substantive failures and nits separately. Report required
    orchestration actions; this answer-only service cannot dispatch sessions or publish candidates itself.
- id: implementer
  harness: native-implement
  model: codex-account
  tools: []
  instructions: 'Fulfil the bound requirements within the session decision policy. Produce candidate
    implementation text or patches and map them to acceptance outcomes. This service has no file-writing
    or execution tools: report missing workspace execution, tests or sandbox evidence as blockers. Do
    not claim a patch was applied or a check executed unless supplied trustworthy evidence establishes
    it.'
- id: inline-reviewer
  harness: native-inline-review
  model: claude-account
  tools: []
  instructions: Independently derive acceptance criteria from the permitted requirements before assessing
    candidate material. Assess outcomes and the supplied verification evidence. Identify substantive
    failures separately from nits and unresolved decisions. Do not accept unexecuted checks as observed
    results or lower a requirement to fit a retry budget.
- id: holistic-reviewer
  harness: native-holistic-review
  model: claude-account
  tools: []
  instructions: Assess the assembled candidate in an independent review context against its stated intention,
    integration, general quality and required domain evidence. Identify interactions missed by section
    reviews, unresolved limitations and acceptance gaps. Produce a scoped finding; this service cannot
    approve an output release, publish to Vuoro or merge a repository change.
compute:
- id: delivery-worker
  kind: local
  destination: private-runtime
grants:
- id: delivery-plan
  agent: product-planner
  callers:
  - delivery-controller
  input_class: C0
  output_class: C0
  compute: delivery-worker
  state_destination: private-state
  telemetry_destination: private-telemetry
  telemetry_class: C0
  receipt_class: C0
  caller_clearance: C0
  return_contract: class-aware
  result_readers:
  - delivery-reader
  - output-approver
  workflow_only: false
  enabled: true
  on_outage: queue
  max_attempts: 2
  timeout_seconds: 900
- id: delivery-discover
  agent: discovery
  callers:
  - delivery-controller
  input_class: C0
  output_class: C0
  compute: delivery-worker
  state_destination: private-state
  telemetry_destination: private-telemetry
  telemetry_class: C0
  receipt_class: C0
  caller_clearance: C0
  return_contract: class-aware
  result_readers:
  - delivery-reader
