  - delivery-controller
  input_class: C0
  output_class: C0
  compute: delivery-worker
  state_destination: private-state
  telemetry_destination: private-telemetry
  telemetry_class: C0
  receipt_class: C0
  caller_clearance: C0
  return_contract: class-aware
  result_readers:
  - delivery-reader
  - output-approver
  workflow_only: true
  enabled: true
  on_outage: queue
  max_attempts: 2
