name: sovite

x-runtime-env: &runtime-env
  SOVITE_DISPLAY_NAME: ${SOVITE_DISPLAY_NAME:-Sovite Platform}
  SOVITE_DATABASE_URL: postgresql+psycopg://sovite:${POSTGRES_PASSWORD:?Run scripts/installation.py compose-init}@postgres:5432/sovite
  SOVITE_DATABASE_SCHEMA: ${SOVITE_DATABASE_SCHEMA:-}
  SOVITE_DATABASE_MIGRATE: ${SOVITE_DATABASE_MIGRATE:-startup}
  SOVITE_BUNDLE_PATH: /config/bundle.yaml
  SOVITE_ARTIFACT_BACKEND: s3
  SOVITE_S3_ENDPOINT: http://garage:3900
  SOVITE_S3_BUCKET: sovite-private
  SOVITE_S3_REGION: garage
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?Run scripts/installation.py compose-init}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?Run scripts/installation.py compose-init}
  AWS_EC2_METADATA_DISABLED: "true"
  SOVITE_PUBLIC_ORIGIN: ${SOVITE_PUBLIC_ORIGIN:-http://localhost:8080}
  SOVITE_SECURE_COOKIES: ${SOVITE_SECURE_COOKIES:-false}
  SOVITE_REQUIRE_QUALIFICATION: ${SOVITE_REQUIRE_QUALIFICATION:-true}
  SOVITE_QUALIFICATION_PUBLIC_KEYS: '["/trust/qualification-public.pem"]'
  SOVITE_EMBEDDED_WORKER: "false"
  SOVITE_COMPUTE_ID: ${SOVITE_COMPUTE_ID:-local}

x-control-env: &control-env
  <<: *runtime-env
  SOVITE_OPERATOR_TOKEN: ${SOVITE_OPERATOR_TOKEN:?Run scripts/installation.py compose-init}
  SOVITE_CALLER_TOKENS: ${SOVITE_CALLER_TOKENS:?Run scripts/installation.py compose-init}

x-runtime: &runtime
  image: ${SOVITE_IMAGE:-sovite-platform:0.1.17}
  build:
    context: .
    target: runtime
  environment: *runtime-env
  volumes:
    - ${SOVITE_BUNDLE:-./config/platform.local.yaml}:/config/bundle.yaml:ro
    - ./.state/trust:/trust:ro
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: unless-stopped
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  control:
    <<: *runtime
    environment: *control-env
    command: [serve, --host, 0.0.0.0, --port, "8080"]
    ports: ["127.0.0.1:${SOVITE_PORT:-8080}:8080"]
    networks: [edge, private]
    depends_on:
      postgres: {condition: service_healthy}
      garage: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
  worker:
    <<: *runtime
    command: [worker]
    networks: [private, inference]
    depends_on:
      control: {condition: service_healthy}
    volumes:
      - ${SOVITE_BUNDLE:-./config/platform.local.yaml}:/config/bundle.yaml:ro
      - ./.state/trust:/trust:ro
      - workspaces:/workspaces
    healthcheck:
      test: [CMD, sovite, worker-health]
      interval: 30s
      timeout: 8s
      retries: 4
      start_period: 30s
    stop_grace_period: 30s
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17.11-alpine}
    environment:
      POSTGRES_DB: sovite
      POSTGRES_USER: sovite
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/installation.py compose-init}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --data-checksums
    networks: [private]
    volumes: [postgres-data:/var/lib/postgresql/data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U sovite -d sovite]
      interval: 10s
      timeout: 5s
      retries: 12
  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.4.1}
    entrypoint: [/garage]
    command: [server, --single-node, --default-bucket]
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Run scripts/installation.py compose-init}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Run scripts/installation.py compose-init}
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?Run scripts/installation.py compose-init}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?Run scripts/installation.py compose-init}
      GARAGE_DEFAULT_BUCKET: sovite-private
    networks: [private]
    volumes:
      - ./deploy/compose/garage.toml:/etc/garage.toml:ro
      - garage-data:/var/lib/garage
    restart: unless-stopped
    healthcheck:
      test: [CMD, /garage, status]
      interval: 15s
      timeout: 5s
      retries: 12
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.6}
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_QUEUE: "16"
    networks: [inference]
    volumes: [ollama-models:/models]
    restart: unless-stopped
    healthcheck:
      test: [CMD, ollama, list]
      interval: 20s
      timeout: 5s
      retries: 6
  model-stage:
    profiles: [staging]
    image: ${OLLAMA_IMAGE:-ollama/ollama:0.40.6}
    entrypoint: [/bin/sh, /stage/model-stage.sh]
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_MODELS: /models
      OLLAMA_NO_CLOUD: "1"
      SOVITE_STAGE_MODEL: ${SOVITE_STAGE_MODEL:-qwen3:4b}
    volumes:
      - ollama-models:/models
      - ./deploy/compose/model-stage.sh:/stage/model-stage.sh:ro
    networks: [staging]
    restart: "no"

networks:
  edge: {}
  private: {internal: true}
  inference: {internal: true}
  staging: {}
volumes:
  postgres-data: {}
  garage-data: {}
  ollama-models: {}
  workspaces: {}
