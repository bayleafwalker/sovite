[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovite-platform"
version = "0.1.24"
description = "A provisioned platform for mixed agent estates with explicit flow contracts"
requires-python = ">=3.11"
dependencies = [
  "vuoro-adapter-kit @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-adapter-kit-v0.2.2/vuoro_adapter_kit-0.2.2-py3-none-any.whl#sha256=6d78c2f05a8e3a72c480b0e333232bc90ccee1a36b71fba09f5bc8fc8e5377fa",
  "vuoro-contracts @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-contracts-v0.2.0/vuoro_contracts-0.2.0-py3-none-any.whl#sha256=7bc6558076fff11591b6382641608a95afebb846c254309673351a29854e12c9 ; python_version >= '3.12'",
  "attrs>=22.2,<27", "typing-extensions>=4.12,<5",
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "boto3>=1.35,<2",
  "PyYAML>=6,<7", "cryptography>=43,<51", "pydantic-settings>=2.5,<3", "jsonschema>=4,<5", "websockets>=13,<16",
]

[project.optional-dependencies]
retention = [
  "vuoro-client @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-client-v0.1.6/vuoro_client-0.1.6-py3-none-any.whl#sha256=b2267290ed28e89e522c94616e46e1167d155334888cbe6bc0bc287b14fcb59d ; python_version >= '3.12'",
]
test = [
  "vuoro-client @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-client-v0.1.6/vuoro_client-0.1.6-py3-none-any.whl#sha256=b2267290ed28e89e522c94616e46e1167d155334888cbe6bc0bc287b14fcb59d ; python_version >= '3.12'",
  "vuoro-workspace @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-workspace-v0.1.1/vuoro_workspace-0.1.1-py3-none-any.whl#sha256=f9c67ec2a731c64bef03821d3e656699f7a6530080b70a1273bd59c688d135f9 ; python_version >= '3.12'",
  "vuoro-schema-runtime @ https://github.com/bayleafwalker/vuoro/releases/download/vuoro-schema-runtime-v0.1.0/vuoro_schema_runtime-0.1.0-py3-none-any.whl#sha256=b66c9357c99aa9e1a7353991ce54105a8621958ecfac47f8c121d80b90b77912 ; python_version >= '3.12'",
  "pytest>=8,<10",
  "setuptools>=68",
  # Receipt-adapter integration tests use the owner's real catalog/identity API.
  "vuoro-service @ git+https://github.com/bayleafwalker/vuoro.git@7dfa23483773d778cb2fa65a152e87b3278d437c#subdirectory=packages/vuoro-service ; python_version >= '3.12'",
]

[project.scripts]
sovite = "sovite.cli:main"
sovite-resource-gateway = "sovite.resource_gateway_cli:main"
sovite-resource-gateway-v2 = "sovite.resource_gateway_v2_cli:main"
sovite-remote-worker = "sovite.remote_worker_cli:main"
sovite-remote-worker-health = "sovite.remote_worker_health:main"

[tool.setuptools.packages.find]
include = ["sovite*"]

[tool.setuptools.package-data]
sovite = ["static/*", "static/**/*", "execution_contract/**/*.json", "repository_repair_contract/**/*.json", "resource_contract/**/*.json", "repository_native_luna_catalog.json", "repository_native_luna_catalog.LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
