[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sovite-platform"
version = "0.1.3"
description = "A provisioned platform for mixed agent estates with explicit flow contracts"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "SQLAlchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "boto3>=1.35,<2",
  "PyYAML>=6,<7", "cryptography>=43,<51", "pydantic-settings>=2.5,<3", "jsonschema>=4,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
sovite = "sovite.cli:main"

[tool.setuptools.packages.find]
include = ["sovite*"]

[tool.setuptools.package-data]
sovite = ["static/*", "static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
