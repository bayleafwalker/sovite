[extend]
useDefault = true

[[allowlists]]
description = "Source file SHA-256 in supplied state-integration evidence"
paths = ['''^docs/STATE-INTEGRATION\.json$''']
regexes = ['''"sovite/api\.py": "[a-f0-9]{64}"''']
regexTarget = "line"
condition = "AND"


[[allowlists]]
description = "Generated contract resource inventory contains these non-secret file SHA-256 values"
paths = ['''^sovite/execution_contract/vuoro_contract_c3c73ae52d117dd8407c15d4b4b549461e753e30de4783134a2cad02f5dd1ab4_client/data/integrity\.json$''']
regexes = ['''\{"files":\{"openapi/contract\.openapi\.json":"cb035723a2cadc3c35454fde6e63bedbc96d90e73a4f85ae6a435e0ec0f1ff4c","operation\-manifest\.json":"57fc98121a02d099a1b607dabaa09f8f0e057c8796e005f489cd4e4b0a47ce5e","schema/contract\.schema\.json":"4653de678f93cdd0edbb6577445149462b27e1fb0afb70e3be01f037988fac4d"\},"schemaVersion":"vuoro\-contract\-integrity/v1"\}''']
regexTarget = "line"
condition = "AND"
