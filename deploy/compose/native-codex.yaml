services:
  native-harness:
    image: ${SOVITE_CODEX_IMAGE:-sovite-platform-codex:0.1.24}
    build:
      context: .
      target: native-codex
      args:
        CODEX_VERSION: "0.163.0"
    entrypoint: [uvicorn]
    command: [sovite.harness_api:create_app, --factory, --host, 0.0.0.0, --port, "8090"]
    environment:
      SOVITE_BUNDLE_PATH: /config/bundle.yaml
      SOVITE_HARNESS_AGENT_ID: ${SOVITE_HARNESS_AGENT_ID:-code-review}
      SOVITE_HARNESS_TOKEN: ${SOVITE_HARNESS_TOKEN:?Run scripts/installation.py compose-init}
      SOVITE_HARNESS_STATE_PATH: /state/harness
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NO_CLOUD: "1"
    volumes:
      - ${SOVITE_BUNDLE:-./config/platform.local.yaml}:/config/bundle.yaml:ro
      - native-harness-state:/state/harness
    networks: [inference]
    read_only: true
    tmpfs: [/tmp:rw,nosuid,size=256m]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health/ready', timeout=5).read()"]
      interval: 20s
      timeout: 5s
      retries: 5
    stop_grace_period: 30s
volumes:
  native-harness-state: {}
