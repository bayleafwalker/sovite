{{- if or (eq .Values.database.schema "public") (eq .Values.database.schema "information_schema") (hasPrefix "pg_" .Values.database.schema) -}}
{{- fail "database.schema must be a non-public, non-system PostgreSQL schema" -}}
{{- end -}}
{{- if eq .Values.mode "enforced" -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.deploymentBinding) -}}
{{- fail "enforced mode requires a reviewed deploymentBinding; use install_kubernetes.py to compute it" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) -}}
{{- fail "enforced mode requires image.digest=sha256:<64 hex>" -}}
{{- end -}}
{{- if or (not .Values.networkPolicy.enabled) (not .Values.networkPolicy.ciliumDns) -}}
{{- fail "enforced mode requires default-deny policies and Cilium DNS query enforcement" -}}
{{- end -}}
{{- if or (not .Values.secureCookies) (not (hasPrefix "https://" .Values.publicOrigin)) (not .Values.qualification.required) -}}
{{- fail "enforced mode requires HTTPS, secure cookies and signed qualification" -}}
{{- end -}}
{{- range $key := list "postgres" "garage" "ollama" -}}
{{- $component := index $.Values $key -}}
{{- if and $component.enabled (not (regexMatch "@sha256:[a-f0-9]{64}$" $component.image)) -}}
{{- fail (printf "enforced mode requires a digest-pinned %s.image" $key) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.nativeHarness.enabled (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.nativeHarness.image.digest)) -}}
{{- fail "enforced mode requires nativeHarness.image.digest" -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.garage.enabled) (not .Values.artifacts.endpoint) -}}
{{- fail "artifacts.endpoint is required when bundled Garage is disabled" -}}
{{- end -}}
{{- if and .Values.kubernetesTools.enabled (empty .Values.kubernetesTools.apiServerCIDRs) -}}
{{- fail "kubernetesTools.apiServerCIDRs must be explicitly provided" -}}
{{- end -}}
{{- if and .Values.nativeHarness.workspace.subPath (not .Values.nativeHarness.workspace.existingClaim) -}}
{{- fail "nativeHarness.workspace.subPath requires an existing approved claim" -}}
{{- end -}}
{{- if and .Values.nativeHarness.workspace.configMap .Values.nativeHarness.workspace.existingClaim -}}
{{- fail "Select one native workspace source: configMap or existingClaim" -}}
{{- end -}}
{{- if and (or .Values.nativeHarness.workspace.existingClaim .Values.nativeHarness.workspace.configMap) (not .Values.nativeHarness.enabled) -}}
{{- fail "An approved workspace requires nativeHarness.enabled" -}}
{{- end -}}
{{- range .Values.networkPolicy.stateEgress -}}
{{- if or (eq .cidr "0.0.0.0/0") (eq .cidr "::/0") -}}{{ fail "Unrestricted state egress is forbidden" }}{{- end -}}
{{- end -}}
{{- range $key := list "modelPeers" "harnessPeers" -}}
{{- range index $.Values.networkPolicy $key -}}
{{- if .cidrs -}}
{{- if or .namespaceSelector .podSelector -}}{{ fail (printf "%s: a peer selects either exact host CIDRs or in-cluster pods, not both" $key) }}{{- end -}}
{{- if not .hosts -}}{{ fail (printf "%s: CIDR peers require the exact endpoint hosts they serve" $key) }}{{- end -}}
{{- range .cidrs -}}
{{- if not (or (hasSuffix "/32" .) (hasSuffix "/128" .)) -}}{{ fail (printf "%s: CIDR peers must be exact hosts (/32 or /128)" $key) }}{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range .Values.modelCredentials -}}
{{- if not (regexMatch "^[A-Z][A-Z0-9_]*$" (default "" .env)) -}}{{ fail "modelCredentials env names must be upper-case environment variable names" }}{{- end -}}
{{- if or (hasPrefix "SOVITE_" .env) (hasPrefix "AWS_" .env) -}}{{ fail "modelCredentials cannot override reserved SOVITE_ or AWS_ runtime variables" }}{{- end -}}
{{- end -}}
{{- range $key, $pem := .Values.modelTrust -}}
{{- if not (regexMatch "^[a-z0-9][a-z0-9-]{0,62}$" $key) -}}{{ fail "modelTrust names must be lower-case DNS labels" }}{{- end -}}
{{- if not (contains "-----BEGIN CERTIFICATE-----" (toString $pem)) -}}{{ fail (printf "modelTrust %s must be a PEM certificate" $key) }}{{- end -}}
{{- end -}}
{{- if and .Values.nativeHarness.sandbox.seccompLocalhostProfile (not .Values.nativeHarness.sandbox.userNamespace) -}}
{{- fail "nativeHarness.sandbox.seccompLocalhostProfile widens namespace syscalls and requires nativeHarness.sandbox.userNamespace" -}}
{{- end -}}
