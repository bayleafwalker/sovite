{{- if eq .Values.mode "enforced" -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.deploymentBinding) -}}
{{- fail "enforced mode requires a reviewed deploymentBinding; use install_kubernetes.py to compute it" -}}
{{- end -}}
{{- if not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.image.digest) -}}
{{- fail "enforced mode requires image.digest=sha256:<64 hex>" -}}
{{- end -}}
{{- if or (not .Values.networkPolicy.enabled) (not .Values.networkPolicy.ciliumDns) -}}
{{- fail "enforced mode requires default-deny policies and Cilium DNS query enforcement" -}}
{{- end -}}
{{- if or (not .Values.secureCookies) (not (hasPrefix "https://" .Values.publicOrigin)) (not .Values.qualification.required) -}}
{{- fail "enforced mode requires HTTPS, secure cookies and signed qualification" -}}
{{- end -}}
{{- range $key := list "postgres" "garage" "ollama" -}}
{{- $component := index $.Values $key -}}
{{- if and $component.enabled (not (regexMatch "@sha256:[a-f0-9]{64}$" $component.image)) -}}
{{- fail (printf "enforced mode requires a digest-pinned %s.image" $key) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.nativeHarness.enabled (not (regexMatch "^sha256:[a-f0-9]{64}$" .Values.nativeHarness.image.digest)) -}}
{{- fail "enforced mode requires nativeHarness.image.digest" -}}
{{- end -}}
{{- end -}}
{{- if and (not .Values.garage.enabled) (not .Values.artifacts.endpoint) -}}
{{- fail "artifacts.endpoint is required when bundled Garage is disabled" -}}
{{- end -}}
{{- if and .Values.kubernetesTools.enabled (empty .Values.kubernetesTools.apiServerCIDRs) -}}
{{- fail "kubernetesTools.apiServerCIDRs must be explicitly provided" -}}
{{- end -}}
{{- if and .Values.nativeHarness.workspace.subPath (not .Values.nativeHarness.workspace.existingClaim) -}}
{{- fail "nativeHarness.workspace.subPath requires an existing approved claim" -}}
{{- end -}}
{{- if and .Values.nativeHarness.workspace.existingClaim (not .Values.nativeHarness.enabled) -}}
{{- fail "An approved workspace requires nativeHarness.enabled" -}}
{{- end -}}
{{- range .Values.networkPolicy.stateEgress -}}
{{- if or (eq .cidr "0.0.0.0/0") (eq .cidr "::/0") -}}{{ fail "Unrestricted state egress is forbidden" }}{{- end -}}
{{- end -}}
