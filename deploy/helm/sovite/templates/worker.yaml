{{- $name := include "sovite.fullname" . -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}-worker
  labels: {{ include "sovite.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.kubernetesTools.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-worker
  labels: {{ include "sovite.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, sovite.component: worker}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sovite, app.kubernetes.io/instance: {{ .Release.Name }}, sovite.component: worker}
      annotations: {sovite.platform/bundle-revision: {{ .Values.bundle.revision | quote }}}
    spec:
      serviceAccountName: {{ $name }}-worker
      automountServiceAccountToken: {{ .Values.kubernetesTools.enabled }}
      terminationGracePeriodSeconds: 45
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {{ toYaml .Values.worker.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.worker.tolerations | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "sovite.image" .Values.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [worker]
          env: {{ include "sovite.runtimeEnv" . | nindent 12 }}
            - name: SOVITE_COMPUTE_ID
              value: {{ .Values.worker.computeId | quote }}
          resources: {{ toYaml .Values.worker.resources | nindent 12 }}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {exec: {command: [sovite, worker-health]}, initialDelaySeconds: 15, periodSeconds: 30, timeoutSeconds: 8}
          livenessProbe: {exec: {command: [sovite, worker-health]}, initialDelaySeconds: 60, periodSeconds: 30, failureThreshold: 4, timeoutSeconds: 8}
          volumeMounts:
            - {name: bundle, mountPath: /config, readOnly: true}
            - {name: trust, mountPath: /trust, readOnly: true}
            - {name: tmp, mountPath: /tmp}
            - {name: workspaces, mountPath: /workspaces}
      volumes:
        - name: bundle
          configMap:
            name: {{ .Values.bundle.configMap }}
            items: [{key: {{ .Values.bundle.key }}, path: bundle.yaml}]
        - name: trust
          configMap: {name: {{ .Values.qualification.configMap }}}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: workspaces
          emptyDir: {sizeLimit: {{ .Values.worker.workspaceSize }}}
{{- if .Values.kubernetesTools.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: {{ $name }}-diagnostics, namespace: {{ .Values.kubernetesTools.namespace }}}
rules:
  - apiGroups: [""]
    resources: [pods, events, services]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: {{ $name }}-diagnostics, namespace: {{ .Values.kubernetesTools.namespace }}}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ $name }}-diagnostics}
subjects:
  - {kind: ServiceAccount, name: {{ $name }}-worker, namespace: {{ .Release.Namespace }}}
{{- end }}
