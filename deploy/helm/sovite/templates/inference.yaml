{{- if .Values.ollama.enabled -}}
{{- $name := include "sovite.fullname" . -}}
apiVersion: v1
kind: Service
metadata: {name: {{ $name }}-ollama}
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, sovite.component: ollama}
  ports: [{name: http, port: 11434, targetPort: http}]
---
{{- if not .Values.ollama.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-models
  {{- with .Values.ollama.persistenceLabels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
  annotations: {helm.sh/resource-policy: keep}
spec:
  accessModes: [ReadWriteOnce]
  {{- if .Values.ollama.storageClass }}
  storageClassName: {{ .Values.ollama.storageClass | quote }}
  {{- end }}
  resources: {requests: {storage: {{ .Values.ollama.storage }}}}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-ollama
  labels: {{ include "sovite.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, sovite.component: ollama}
  template:
    metadata:
      labels: {app.kubernetes.io/name: sovite, app.kubernetes.io/instance: {{ .Release.Name }}, sovite.component: ollama}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.ollama.runtimeClassName }}
      runtimeClassName: {{ . | quote }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      nodeSelector: {{ toYaml .Values.ollama.nodeSelector | nindent 8 }}
      tolerations: {{ toYaml .Values.ollama.tolerations | nindent 8 }}
      containers:
        - name: ollama
          image: {{ .Values.ollama.image | quote }}
          ports: [{name: http, containerPort: 11434}]
          env:
            - {name: HOME, value: /state}
            - {name: OLLAMA_HOST, value: "0.0.0.0:11434"}
            - {name: OLLAMA_MODELS, value: /models}
            - {name: OLLAMA_NO_CLOUD, value: "1"}
            - {name: OLLAMA_NUM_PARALLEL, value: "1"}
            - {name: OLLAMA_MAX_QUEUE, value: "16"}
            - {name: OLLAMA_GPU_OVERHEAD, value: {{ .Values.ollama.gpuOverheadBytes | quote }}}
            - {name: OLLAMA_KEEP_ALIVE, value: "10m"}
          resources: {{ toYaml .Values.ollama.resources | nindent 12 }}
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
          readinessProbe: {httpGet: {path: /api/tags, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /api/version, port: http}, initialDelaySeconds: 30, periodSeconds: 20}
          startupProbe: {httpGet: {path: /api/version, port: http}, failureThreshold: 60, periodSeconds: 5}
          volumeMounts:
            - {name: models, mountPath: /models}
            - {name: tmp, mountPath: /tmp}
            - {name: state, mountPath: /state}
      volumes:
        - name: models
          persistentVolumeClaim: {claimName: {{ default (printf "%s-models" $name) .Values.ollama.existingClaim }}}
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        - {name: state, emptyDir: {sizeLimit: 32Mi}}
{{- end }}
