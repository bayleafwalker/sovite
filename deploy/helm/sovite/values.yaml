fullnameOverride: sovite
displayName: Sovite Platform
# Development permits version tags. Enforced requires immutable digests for all workloads.
mode: development
# Generated by install_kubernetes.py from the reviewed nonsecret deployment.
deploymentBinding: ""
image:
  repository: sovite-platform
  tag: "0.1.2"
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
bundle:
  configMap: sovite-bundle
  key: bundle.yaml
  revision: "operator-supplied"
runtimeSecret: sovite-runtime
qualification:
  required: true
  configMap: sovite-trust
  publicKeyFiles: [qualification-public.pem]
publicOrigin: https://sovite.example.internal
secureCookies: true
control:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
worker:
  replicas: 1
  computeId: local
  # Upper bound on one job attempt; a grant's timeout_seconds applies only below it.
  jobTimeoutSeconds: 300
  resources:
    requests: {cpu: 250m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  workspaceSize: 2Gi
nativeHarness:
  enabled: false
  agentId: code-review
  image:
    repository: sovite-platform-codex
    tag: "0.1.2"
    digest: ""
  storage: 10Gi
  storageClass: ""
  # Optional previously staged input. No hostPath or writable input mount is created.
  workspace:
    existingClaim: ""
    configMap: ""
    subPath: ""
  resources:
    requests: {cpu: 250m, memory: 512Mi}
    limits: {cpu: "2", memory: 2Gi}
postgres:
  enabled: true
  image: postgres:17.11-alpine
  storage: 20Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "2", memory: 1Gi}
garage:
  enabled: true
  image: dxflrs/garage:v2.4.1
  storage: 50Gi
  storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
artifacts:
  # When Garage is disabled, supply a reachable approved S3 endpoint here.
  endpoint: ""
  bucket: sovite-private
  region: garage
ollama:
  enabled: true
  runtimeClassName: ""
  gpuOverheadBytes: "0"
  image: ollama/ollama:0.40.6
  storage: 50Gi
  storageClass: ""
  existingClaim: ""
  nodeSelector: {}
  tolerations: []
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {cpu: "4", memory: 12Gi}
  # Pre-stage model weights into the PVC. No model registry egress is allowed at runtime.
networkPolicy:
  enabled: true
  ciliumAPIServer: false
  # Cilium provides exact DNS query allowlists; no unrestricted UDP/53 exception is created.
  ciliumDns: true
  dnsNamespace: kube-system
  dnsPodLabels: {k8s-app: kube-dns}
  clusterDomain: cluster.local
  extraDnsNames: []
  # Explicit CIDRs and ports for externally managed state only. Never use 0.0.0.0/0.
  stateEgress: []
  # Allowed tool service pods. Both selectors are required to avoid broad namespace access.
  toolPeers: []
  # Model and harness peers are either in-cluster pods (exact hosts plus both selectors) or
  # hosts outside the cluster: exact host CIDRs (/32 or /128) with the IP literals they serve.
  # Reachability is all the chart grants; an external host needs its own controls.
  modelPeers: []
  harnessPeers: []
  # Only these gateway pods can reach the private operator/API service.
  controlIngress:
    ciliumGateway: false
    namespaceSelector:
      matchLabels: {kubernetes.io/metadata.name: gateway-system}
    podSelector:
      matchLabels: {app.kubernetes.io/name: envoy}
# Provider credentials named by bundle models' api_key_env, injected from runtimeSecret into
# the worker and native harness. key defaults to env.
modelCredentials: []
kubernetesTools:
  enabled: false
  namespace: production
  # Actual Kubernetes API endpoint address(es), supplied by the cluster operator.
  apiServerCIDRs: []
  apiServerPort: 6443
ingress:
  enabled: false
  className: ""
  host: sovite.example.internal
  tlsSecretName: sovite-tls
  annotations: {}
